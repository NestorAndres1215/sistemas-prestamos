name: CI - Sistema de Préstamos

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Mostrar versión de .NET
        run: dotnet --version

      - name: Restaurar dependencias
        run: dotnet restore sistemas-prestamos.sln

      - name: Compilar solución
        run: dotnet build sistemas-prestamos.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test sistemas-prestamos.sln --configuration Release --no-build
